body_fields:

  - type: section_title
    value: "1. Startup — loading configuration"

  - type: text
    value: |
      Every dx5 session begins by loading three configuration files.
      These define the blog settings, the content type registry,
      and the field type schemas:

  - type: pre
    lang: rust
    path: "src/config.rs"
    value: |
      // dx5 loads three config files at startup
      let blog_config: BlogConfig = load_toml("config/dx5.toml")?;
      // blog_config = { title: "Dx5", base_url: "https://dx5.dev", ... }

      let content_types: ContentTypes = load_toml("config/dx5.content_types.toml")?;
      // content_types = { types: { post: { dir: "./contents/posts", route: "/posts", ... } } }

      let fields_config: FieldsConfig = load_toml("config/dx5.fields.toml")?;
      // fields_config = {
      //   fields: {
      //     "text":   { template: "components/fields/text",   schema: { value: "string", safe: "bool" } },
      //     "callout": { template: "components/fields/callout", schema: { value: "string", variant: "string", ... } },
      //     ...
      //   }
      // }

  - type: callout
    variant: note
    title: "Serde deserialization"
    value: >
      All configuration is deserialized using serde with strict typing.
      Unknown fields in TOML files are silently ignored, so adding
      comments or extra metadata is safe.

  - type: section_title
    value: "2. Content loading"

  - type: text
    value: |
      Once configured, dx5 scans the content directories.
      Each YAML file is parsed using gray_matter to extract
      the front matter (the metadata between --- delimiters)
      and the optional raw body content:

  - type: pre
    lang: rust
    path: "src/contents.rs"
    value: |
      // Each content type directory is scanned recursively
      fn load_contents(dir: &Path) -> Vec<Content> {
          let mut contents = Vec::new();

          for entry in walkdir(dir) {
              let path = entry.path();
              if path.extension() != Some("yaml") {
                  continue;
              }

              // gray_matter splits the file into front matter + body
              let file = std::fs::read_to_string(path)?;
              let matter = gray_matter::parse(&file);

              // Deserialize the front matter into our Content struct
              let content: Content = serde_yaml::from_str(matter.front_matter)?;
              // content = {
              //   id: "0x01",
              //   title: "...",
              //   category: "FORGE_LOG",
              //   body_fields: [ { type: "text", value: "..." }, ... ]
              // }

              content.content = matter.content; // raw body after ---
              contents.push(content);
          }

          contents
      }

  - type: callout
    variant: tip
    title: "Dynamic body fields"
    value: >
      The body_fields array uses serde's flatten feature to store
      arbitrary key-value pairs alongside the type field.
      This is what makes custom field schemas possible without
      a rigid type system.

  - type: section_title
    value: "3. The BodyFieldDyn trick"

  - type: text
    safe: true
    value: |
      The magic is in the <code>BodyFieldDyn</code> struct.
      Each body field has a <code>type</code> field and any number
      of additional attributes stored in a <code>HashMap</code>:

  - type: pre
    lang: rust
    path: "src/contents.rs"
    value: |
      // Each body field is dynamically typed at the YAML level
      #[derive(Debug, Deserialize)]
      pub struct BodyFieldDyn {
          #[serde(rename = "type")]
          pub _type: String,

          #[serde(flatten)]
          pub attributes: HashMap<String, serde_json::Value>,
      }

      // The key insight: serde(flatten) collects every field
      // that is NOT "type" into the HashMap.
      // This means:
      //   - type: callout
      //     value: "Hello"
      //     variant: "note"
      //
      // becomes BodyFieldDyn {
      //   _type: "callout",
      //   attributes: { "value": "Hello", "variant": "note" }
      // }

  - type: section_title
    value: "4. Field rendering"

  - type: text
    value: |
      Rendering happens in two phases. First, all field templates
      are loaded into Tera at startup. Then, when a page is requested,
      each body field is rendered by looking up its template:

  - type: pre
    lang: rust
    path: "src/fields.rs"
    value: |
      // Phase 1: Register all field templates at startup
      fn register_field_templates(
          tera: &mut Tera,
          fields: &FieldsConfig,
      ) -> Result<()> {
          for (name, field_def) in &fields.fields {
              let template_path = format!(
                  "templates/{}.tera",
                  field_def.template // e.g. "components/fields/callout"
              );
              tera.add_template_file(template_path, Some(name))?;
          }
          Ok(())
      }

      // Phase 2: Render a single body field
      fn render_field(
          tera: &Tera,
          field: &BodyFieldDyn,
          fields: &FieldsConfig,
      ) -> Result<String> {
          let def = fields.fields.get(&field._type)?;
          let mut ctx = Context::new();

          // Pass all attributes as template variables
          for (key, value) in &field.attributes {
              ctx.insert(key, value);
          }

          // Render using the field type's template
          tera.render(&field._type, &ctx)
      }

  - type: section_title
    value: "5. The request lifecycle"

  - type: text
    value: |
      When a client requests a URL, the full pipeline looks like this:

  - type: terminal
    title: "GET /en/posts/0x01"
    prompt: "#"
    value: |
      1. Rocket matches GET /<lang>/posts/<id>
      2. dx5 loads Content with id="0x01" from the posts cache
      3. Tera renders "types/single.html.tera" with the Content context
      4. The template iterates content.body_fields:
         for each field, it calls render_field()
      5. render_field() looks up the field type's template
         and renders it with the field's attributes
      6. The assembled HTML is returned to the client
      ---
      Total time: ~200µs per field (cold cache)
      Total time: ~2-5ms per page (warm cache)

  - type: section_title
    value: "6. Caching & filesystem watching"

  - type: text
    value: |
      dx5 maintains an in-memory cache of parsed content and pagination
      state. The filesystem watcher uses the notify crate to listen
      for file changes and invalidate the relevant cache entries:

  - type: pre
    lang: rust
    path: "src/watcher.rs"
    value: |
      // Simplified watcher logic
      fn start_watcher(tx: Sender<Event>) -> Result<()> {
          let mut watcher = notify::watcher(tx, Duration::from_secs(2))?;

          // Watch all content directories
          for content_type in config.content_types.values() {
              watcher.watch(content_type.dir, RecursiveMode::Recursive)?;
          }

          loop {
              match rx.recv() {
                  Ok(Event::Create(path))
                  | Ok(Event::Remove(path))
                  | Ok(Event::Modify(path)) => {
                      if path.extension() == Some("yaml") {
                          rebuild_cache(&path);
                      }
                  }
                  _ => {}
              }
          }
      }

  - type: section_title
    value: "7. Putting it all together"

  - type: text
    value: |
      The main function wires everything together —
      configuration, templates, routes, and the watcher:

  - type: pre
    lang: rust
    path: "src/main.rs"
    value: |
      #[launch]
      fn rocket() -> _ {
          let config = Config::load();
          let fields = FieldsConfig::load();

          rocket::build()
              .manage(config.clone())
              .manage(fields.clone())
              .mount("/", routes![index, get_post, paginated_index])
              .mount("/api", routes![api_index, api_single])
              .mount("/admin", routes![admin_ui, api_admin])
              .mount("/static", FileServer::from("static/"))
              .attach(Template::custom(move |engines| {
                  register_field_templates(&mut engines.tera, &fields);
                  register_helpers(&mut engines.tera);
              }))
              .attach(CacheManager::fairing())
              .attach(FileWatcher::fairing())
      }

  - type: text
    value: |
      That is the entire system. Configuration, content, fields,
      templates, caching, watching — all running in a single Rust
      binary with no external dependencies beyond the filesystem.

  - type: date
    value: "2026-05-07"

