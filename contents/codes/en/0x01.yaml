      // dx5 — how it works, roughly
      
      // 1. Load configuration from dx5.toml
      let config = Config::load("dx5.toml");
      
      // 2. Load field definitions from dx5.fields.toml
      //    Each field type → Tera template + data schema
      let fields = FieldsConfig::load("dx5.fields.toml");
      // fields = {
      //   "text"          → { template: "fields/text",          schema: { value, safe } }
      //   "spotify_embed" → { template: "fields/spotify_embed", schema: { track_id }   }
      //   ...
      // }
      
      // 3. Read posts from YAML files
      let posts = read_dir("contents/posts/")
      .map(|file| parse_yaml_frontmatter(file))
      .collect::<Vec<PostContext>>();
      // post = {
      //   id: "0x01", title: "...", category: "MEM_ARCH",
      //   body_fields: [
      //     { type: "text",          value: "..."           },
      //     { type: "spotify_embed", track_id: "4uLU6hM..." },
      //   ]
      // }
      
      // 4. Pre-load all field templates into Tera at startup
      for (field_type, def) in &fields {
        let path = format!("templates/{}.tera", def.template);
        tera.add_template_file(path);
      }
        
      // 5. Register render_field() as a global Tera function
      //    Called from post.html: {{ render_field(field=field, type=field.type) | safe }}
      tera.register_function("render_field", |args| {
        let field_type = args["type"];               // e.g. "spotify_embed"
        let template   = fields[field_type].template; // e.g. "fields/spotify_embed"
        
        let mut ctx = Context::new();
        ctx.insert("field", args["field"]);          // { track_id: "4uLU6hM..." }
        
        tera.render(template, &ctx)                  // → "<iframe src=...></iframe>"
      });
      
      // 6. Serve routes with Rocket
      rocket::build()
        .mount("/",          routes![index, get_post])
        .mount("/assets",    FileServer::from("assets"))
        .mount("/admin",     routes![admin_ui, api_posts]) // optional
        .attach(Template::custom(|engines| {
        // ↑ where steps 4 and 5 actually happen
      }))
      .launch();
