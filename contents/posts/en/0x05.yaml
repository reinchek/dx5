  - type: section_title
    value: "Admin panel"

  - type: text
    safe: true
    value: |
      dx5 includes a full single-page admin interface built with
      Alpine.js and Tailwind CSS. It is served from a single
      <code>admin_ui.html</code> file embedded in the Rust binary.
      The admin panel provides CRUD operations for all content types.

  - type: text
    value: |
      The admin API is protected by a token configured in dx5.toml.
      In production, inject it via an environment variable instead
      of committing it to version control.

  - type: terminal
    title: "admin endpoints"
    prompt: "$"
    value: |
      GET    /admin              → admin UI (SPA)
      POST   /api/admin/contents → create content
      PUT    /api/admin/contents → update content
      DELETE /api/admin/contents → delete content

  - type: callout
    variant: danger
    title: "Security"
    value: >
      Change the admin token before deploying. Use an environment variable
      and never commit secrets to your repository.

  - type: section_title
    value: "JSON API"

  - type: text
    value: |
      Every content type automatically exposes a JSON API.
      This is used by the SPA router and is available to external clients.
      The API returns structured content including parsed body_fields:

  - type: terminal
    title: "API usage"
    prompt: "$"
    value: |
      curl -s http://localhost:8000/api/en/posts | jq '.'
      curl -s http://localhost:8000/api/en/posts/0x01 | jq '.'

  - type: pre
    lang: json
    value: |
      {
        "id": "0x01",
        "title": "Field catalogue demo post",
        "category": "SYS_CALL",
        "created": "2026-04-12",
        "body_fields": [
          { "type": "date", "value": "2026-04-12" },
          { "type": "text", "value": "..." }
        ]
      }

  - type: section_title
    value: "Multilingual support"

  - type: text
    value: |
      dx5 supports multiple languages out of the box. Content is organized
      by language subdirectories, and UI strings are managed through
      JSON locale files.

  - type: text
    safe: true
    value: |
      Languages are declared in <code>config/dx5.toml</code>:

  - type: pre
    lang: toml
    path: "config/dx5.toml"
    value: |
      [languages]
      en = "English"
      it = "Italiano"

  - type: text
    safe: true
    value: |
      UI translations live in <code>config/locales/</code>:

  - type: pre
    lang: text
    value: |
      config/locales/
      ├── en.json    → English UI strings
      ├── it.json    → Italian UI strings
      └── de.json    → German UI strings

  - type: text
    safe: true
    value: |
      Templates use the <code>t()</code> macro to render translated strings.
      Locale files also define category display names and labels
      used throughout the navigation.

  - type: section_title
    value: "Filesystem watcher"

  - type: text
    value: |
      dx5 uses the notify crate to watch the content directories for changes.
      When a file is added, modified, or removed, the pagination cache and
      index are rebuilt automatically — no restart required.

  - type: date
    value: "2026-05-07"

  - type: eol
