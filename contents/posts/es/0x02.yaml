---
id: "0x02"
lang: "es"
title: "0x02 Tipos de Contenido y Organización"
summary: "Cómo dx5 organiza el contenido en tipos — publicaciones, códigos, notas — y cómo la estructura de directorios se asigna a las rutas."
category: "EXPLORE"
created: "2026-05-02"
status: true
author: "Nino Marrazzo aka reinchek"

body_fields:

  - type: hero_title
    value: "Tipos de Contenido y Organización"
    value_glitch: "T1p0s d3 C0nt3n1d0 y 0rg4n1z4c1ón"
    env: true
    env_id: 4

  - type: text
    value: |
      dx5 organiza el contenido en tipos. Cada tipo es un directorio de archivos YAML
      con su propia ruta, entrada de menú y plantilla de visualización.
      Los tipos se definen en un único archivo de configuración TOML.

  - type: section_title
    value: "Definir tipos de contenido"

  - type: text
    value: |
      Los tipos de contenido se declaran en config/dx5.content_types.toml.
      Cada tipo especifica un directorio de origen, extensión de archivo, ruta URL
      y metadatos de navegación:

  - type: pre
    lang: toml
    path: "config/dx5.content_types.toml"
    value: |
      [types.post]
      dir        = "./contents/posts"
      extension  = "yaml"
      route      = "/posts"
      menu_icon  = "fa-regular fa-keyboard"
      menu_label = "Posts"
      menu_order = 1
      is_default = true
      pagination_items_per_page = 10
      enable_navigation = true

      [types.code]
      dir        = "./contents/codes"
      extension  = "yaml"
      route      = "/codes"
      menu_icon  = "fa-solid fa-code"
      menu_label = "Code"
      menu_order = 2

      [types.notes]
      dir        = "./contents/notes"
      extension  = "yaml"
      route      = "/notes"
      menu_icon  = "fa-solid fa-code"
      menu_label = "Note"
      menu_order = 2

  - type: callout
    variant: note
    title: "La bandera is_default"
    value: >
      El tipo con is_default = true sirve su índice en la raíz
      de la URL del idioma (p. ej. /es en lugar de /es/posts).

  - type: section_title
    value: "Estructura de directorios"

  - type: text
    value: |
      Dentro de cada directorio de tipo de contenido, los archivos se organizan por idioma:

  - type: pre
    lang: text
    value: |
      contents/
      ├── posts/
      │   ├── en/
      │   │   ├── 0x00.template.yaml
      │   │   ├── 0x01.yaml
      │   │   └── 0x02.yaml
      │   └── es/
      │       ├── 0x00.template.yaml
      │       ├── 0x01.yaml
      │       └── 0x02.yaml
      ├── codes/
      │   └── en/
      │       ├── 0x00.template.yaml
      │       ├── 0x01.yaml
      │       └── 0x02.yaml
      ├── notes/
      │   └── en/
      │       └── 0x01.yaml
      └── home/
          ├── home.en.yaml
          ├── home.es.yaml
          └── home.de.yaml

  - type: text
    value: |
      El subdirectorio de idioma determina el idioma del contenido.
      La página de inicio es especial — vive fuera del sistema de tipos
      y se configura por separado.

  - type: section_title
    value: "Paginación"

  - type: text
    value: |
      Los tipos de contenido con pagination_items_per_page configurado dividen
      automáticamente su índice en múltiples páginas. El observador del sistema de archivos
      reconstruye los cachés de paginación cada vez que se añade, elimina o modifica un archivo.

  - type: terminal
    title: "rutas generadas automáticamente"
    prompt: "$"
    value: |
      /es          → publicaciones, página 1
      /es/page/2   → publicaciones, página 2
      /es/codes    → índice de códigos
      /es/notes    → índice de notas

  - type: date
    value: "2026-05-07"

  - type: eol
---
