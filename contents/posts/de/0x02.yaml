title: "0x02 Inhaltstypen und Organisation"
summary: "Wie dx5 Inhalte in Typen organisiert - Beiträge, Codes, Notizen - und wie die Verzeichnisstruktur auf Routen abgebildet wird."
category: "EXPLORE"
created: "2026-05-02"
status: true
author: "Nino Marrazzo aka reinchek"

body_fields:

  - type: hero_title
    value: "Inhaltstypen und Organisation"
    value_glitch: "1nh4ltstyp3n und 0rg4n1s4t10n"
    env: true
    env_id: 4

  - type: text
    value: |
      dx5 organisiert Inhalte in Typen. Jeder Typ ist ein Verzeichnis mit YAML-Dateien,
      das eine eigene Route, Menüeintrag und Anzeigevorlage hat.
      Typen werden in einer einzigen TOML-Konfigurationsdatei definiert.

  - type: section_title
    value: "Inhaltstypen definieren"

  - type: text
    value: |
      Inhaltstypen werden in config/dx5.content_types.toml deklariert.
      Jeder Typ gibt ein Quellverzeichnis, eine Dateierweiterung, eine URL-Route
      und Navigationsmetadaten an:

  - type: pre
    lang: toml
    path: "config/dx5.content_types.toml"
    value: |
      [types.post]
      dir        = "./contents/posts"
      extension  = "yaml"
      route      = "/posts"
      menu_icon  = "fa-regular fa-keyboard"
      menu_label = "Posts"
      menu_order = 1
      is_default = true
      pagination_items_per_page = 10
      enable_navigation = true

      [types.code]
      dir        = "./contents/codes"
      extension  = "yaml"
      route      = "/codes"
      menu_icon  = "fa-solid fa-code"
      menu_label = "Code"
      menu_order = 2

      [types.notes]
      dir        = "./contents/notes"
      extension  = "yaml"
      route      = "/notes"
      menu_icon  = "fa-solid fa-code"
      menu_label = "Note"
      menu_order = 2

  - type: callout
    variant: note
    title: "Das is_default-Flag"
    value: >
      Der Typ mit is_default = true liefert seinen Index unter der
      Sprach-URL aus (z. B. /de anstatt /de/posts).

  - type: section_title
    value: "Verzeichnisstruktur"

  - type: text
    value: |
      Innerhalb jedes Inhaltstyp-Verzeichnisses sind die Dateien nach Sprache organisiert:

  - type: pre
    lang: text
    value: |
      contents/
      ├── posts/
      │   ├── en/
      │   │   ├── 0x00.template.yaml
      │   │   ├── 0x01.yaml
      │   │   └── 0x02.yaml
      │   └── de/
      │       ├── 0x00.template.yaml
      │       ├── 0x01.yaml
      │       └── 0x02.yaml
      ├── codes/
      │   └── en/
      │       ├── 0x00.template.yaml
      │       ├── 0x01.yaml
      │       └── 0x02.yaml
      ├── notes/
      │   └── en/
      │       └── 0x01.yaml
      └── home/
          ├── home.en.yaml
          ├── home.de.yaml
          └── home.de.yaml

  - type: text
    value: |
      Das Sprachunterverzeichnis bestimmt die Sprache des Inhalts.
      Die Startseite ist speziell - sie existsert außerhalb des Typsystems
      und wird separat konfiguriert.

  - type: section_title
    value: "Paginierung"

  - type: text
    value: |
      Inhaltstypen mit gesetztem pagination_items_per_page teilen ihren
      Index automatisch auf mehrere Seiten auf. Der Dateisystem-Watcher
      baut die Paginierungs-Caches neu auf, sobald eine Datei hinzugefügt, entfernt oder geändert wird.

  - type: terminal
    title: "automatisch generierte Routen"
    prompt: "$"
    value: |
      /de          → Beiträge, Seite 1
      /de/page/2   → Beiträge, Seite 2
      /de/codes    → Code-Index
      /de/notes    → Notizen-Index

  - type: date
    value: "2026-05-07"

  - type: eol
---
