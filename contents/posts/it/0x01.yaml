body_fields:

  - type: hero_title
    value: "Cos'è dx5?"
    value_glitch: "C0s'è dx5?"
    env: true
    env_id: 1

  - type: text
    safe: true
    value: >
      <strong>dx5</strong> è un <strong>CMS basato su file</strong> scritto in Rust.
      Ogni contenuto — articoli, frammenti di codice, note, la homepage —
      è un semplice file YAML su disco. Niente database, niente pannello admin, niente vincoli.
      Solo il tuo editor di testo e <code>cargo run</code>.

  - type: callout
    variant: note
    title: "Filosofia"
    value: >
      dx5 tratta i contenuti come dati. Ogni file YAML definisce campi strutturati
      che vengono renderizzati tramite template Tera, offrendo la flessibilità
      di un database con la semplicità dei file flat.

  - type: section_title
    value: "Perché basato su file?"

  - type: text
    safe: true
    value: |
      Un CMS basato su file risolve i problemi che i sistemi basati su database creano:
      <ul>
        <li><strong>Controllo versione</strong> — ogni articolo è un file di testo. <code>git diff</code> funziona subito.</li>
        <li><strong>Backup</strong> — <code>tar czf backup.tar.gz contents/</code> è tutto ciò che serve.</li>
        <li><strong>Niente vincoli</strong> — i tuoi contenuti sono in YAML. Qualunque strumento può leggerli.</li>
        <li><strong>Semplicità</strong> — niente migrazioni dello schema, niente pool di connessioni, niente ORM.</li>
      </ul>

  - type: blockquote
    value: >
      dx5 trasforma i tuoi file di testo in un sito web completamente dinamico, senza database.
    author: "dx5 core team"
    reference: "https://dx5.dev"

  - type: section_title
    value: "Architettura principale"

  - type: text
    value: |
      dx5 è costruito sull'ecosistema Rust. Lo stack è volutamente minimale:

  - type: pre
    lang: toml
    path: "Cargo.toml"
    value: |
      [dependencies]
      rocket = { version = "0.5.1", features = ["json"] }
      rocket_dyn_templates = { version = "0.2.0", features = ["tera"] }
      serde = "1.0"
      serde_yaml = "0.9"
      gray_matter = "0.3.2"

  - type: text
    value: |
      Rocket gestisce HTTP e il routing, Tera renderizza i template HTML,
      e serde_yaml + gray_matter analizzano l'intestazione YAML.
      L'intera pipeline — carica, analizza, renderizza, servi — si compila in un singolo binario.

  - type: section_title
    value: "Avvio rapido"

  - type: text
    safe: true
    value: |
      Clona il repository, inserisci un file YAML in <code>contents/posts/en/</code>,
      ed esegui:

  - type: terminal
    title: "bash — project root"
    prompt: "$"
    value: |
      cargo run
      # dx5 è ora attivo su http://localhost:8000

  - type: text
    value: |
      Questo è l'intero flusso di lavoro. Scrivi YAML, vedi il risultato nel browser.
      Nessuna fase di build, nessun database, nessun container.

  - type: callout
    variant: tip
    title: "Provalo"
    value: >
      Copia 0x00.template.yaml in un nuovo file, compila i campi,
      e salva. Il filesystem watcher di dx5 rileverà la modifica
      e ricostruirà l'indice automaticamente.

  - type: date
    value: "2026-05-07"

  - type: eol
