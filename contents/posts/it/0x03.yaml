title: "0x03 Il Sistema dei Campi"
summary: "La funzionalità più potente di dx5 — campi body personalizzati e validati tramite schema, renderizzati con template Tera."
category: "FORGE_LOG"
created: "2026-05-03"
status: true
author: "Nino Marrazzo aka reinchek"

body_fields:

  - type: hero_title
    value: "Il Sistema dei Campi"
    value_glitch: "Il S1st3m4 d31 C4mp1"
    env: true
    env_id: 8

  - type: text
    safe: true
    value: |
      Ogni file di contenuto dx5 ha un array <code>body_fields</code>.
      Ogni voce è un blocco con un <code>type</code> e una serie di
      attributi specifici del tipo. Il tipo determina quale template Tera
      renderizza il blocco e contro quale schema viene validato.

  - type: callout
    variant: note
    title: "Come funziona"
    value: >
      I template dei campi sono precaricati in Tera all'avvio.
      Quando renderizza una pagina, dx5 itera su body_fields,
      cerca il template per tipo e renderizza ogni blocco indipendentemente.

  - type: section_title
    value: "Definire un tipo di campo"

  - type: text
    value: |
      I tipi di campo sono definiti in config/dx5.fields.toml.
      Ogni campo ha una descrizione e uno schema che mappa
      i nomi degli attributi ai loro tipi YAML attesi:

  - type: pre
    lang: toml
    path: "config/dx5.fields.toml"
    value: |
      [fields.callout]
      description = "Note, warning e suggerimenti."
      [fields.callout.schema]
      value   = "string"
      variant = "string"
      title   = "string"
      safe    = "bool"

      [fields.pre]
      description = "Blocco di codice formattato con evidenziazione della sintassi."
      [fields.pre.schema]
      lang  = "string"
      value = "string"
      path  = "string"

      [fields.spotify_embed]
      description = "Player Spotify incorporato."
      [fields.spotify_embed.schema]
      track_id = "string"

  - type: callout
    variant: tip
    title: "Blocchi riutilizzabili"
    value: >
      Una volta definito un tipo di campo, puoi usarlo in qualsiasi file di contenuto.
      Aggiungi un callout, incorpora un player Spotify o inserisci un blocco di codice —
      il renderer gestisce il resto.

  - type: section_title
    value: "Template dei campi (Tera)"

  - type: text
    value: |
      Ogni tipo di campo corrisponde a un template Tera in templates/components/fields/.
      Il template riceve gli attributi del campo come variabile di contesto.
      Ecco il template per il campo callout:

  - type: pre
    lang: html
    path: "templates/components/fields/callout.tera"
    value: |
      <div class="callout callout--{{ field.variant }}">
        {% if field.title %}
        <strong class="callout__title">{{ field.title }}</strong>
        {% endif %}
        <div class="callout__body">
          {% if field.safe %}
            {{ field.value | safe }}
          {% else %}
            {{ field.value | escape }}
          {% endif %}
        </div>
      </div>

  - type: section_title
    value: "Tipi di campo integrati"

  - type: text
    value: |
      dx5 include un ricco set di campi integrati. Ecco i più comuni:

  - type: text
    safe: true
    value: |
      <table>
        <thead>
          <tr><th>Tipo</th><th>Scopo</th></tr>
        </thead>
        <tbody>
          <tr><td><code>text</code></td><td>Testo libero con HTML sicuro opzionale</td></tr>
          <tr><td><code>hero_title</code></td><td>Titolo glitch grande con sfondo</td></tr>
          <tr><td><code>image</code></td><td>Immagine con didascalia e testo alternativo</td></tr>
          <tr><td><code>pre</code></td><td>Blocco di codice con evidenziazione sintassi</td></tr>
          <tr><td><code>terminal</code></td><td>Visualizzazione sessione shell</td></tr>
          <tr><td><code>callout</code></td><td>Riquadro nota, suggerimento, avviso o pericolo</td></tr>
          <tr><td><code>blockquote</code></td><td>Citazione estesa con autore</td></tr>
          <tr><td><code>spotify_embed</code></td><td>Player Spotify incorporato</td></tr>
        </tbody>
      </table>

  - type: section_title
    value: "Esempio: un blocco di testo"

  - type: text
    value: |
      Nel tuo file YAML, scrivi:

  - type: pre
    lang: yaml
    value: |
      body_fields:
        - type: text
          value: |
            Questo viene renderizzato da templates/components/fields/text.tera.
          safe: true

  - type: text
    value: |
      Questa è l'intera API. Scrivi YAML, definisci un template, renderizza.

  - type: date
    value: "2026-05-07"

  - type: eol
---
