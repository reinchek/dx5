id: "0x02"
lang: "fr"
title: "0x02 Types de Contenu et Organisation"
summary: "Comment dx5 organise le contenu en types — articles, codes, notes — et comment la structure des répertoires correspond aux routes."
category: "EXPLORE"
created: "2026-05-02"
status: true
author: "Nino Marrazzo aka reinchek"

body_fields:

  - type: hero_title
    value: "Types de Contenu et Organisation"
    value_glitch: "Typ3s d3 C0nt3nu et 0rg4n1s4t10n"
    env: true
    env_id: 4

  - type: text
    value: |
      dx5 organise le contenu en types. Chaque type est un répertoire de fichiers YAML
      avec sa propre route, entrée de menu et template d'affichage.
      Les types sont définis dans un seul fichier de configuration TOML.

  - type: section_title
    value: "Définir les types de contenu"

  - type: text
    value: |
      Les types de contenu sont déclarés dans config/dx5.content_types.toml.
      Chaque type spécifie un répertoire source, une extension de fichier, une route URL,
      et des métadonnées de navigation:

  - type: pre
    lang: toml
    path: "config/dx5.content_types.toml"
    value: |
      [types.post]
      dir        = "./contents/posts"
      extension  = "yaml"
      route      = "/posts"
      menu_icon  = "fa-regular fa-keyboard"
      menu_label = "Posts"
      menu_order = 1
      is_default = true
      pagination_items_per_page = 10
      enable_navigation = true

      [types.code]
      dir        = "./contents/codes"
      extension  = "yaml"
      route      = "/codes"
      menu_icon  = "fa-solid fa-code"
      menu_label = "Code"
      menu_order = 2

      [types.notes]
      dir        = "./contents/notes"
      extension  = "yaml"
      route      = "/notes"
      menu_icon  = "fa-solid fa-code"
      menu_label = "Note"
      menu_order = 2

  - type: callout
    variant: note
    title: "Le drapeau is_default"
    value: >
      Le type avec is_default = true sert son index à la racine
      de l'URL de la langue (p. ex. /fr au lieu de /fr/posts).

  - type: section_title
    value: "Structure des répertoires"

  - type: text
    value: |
      À l'intérieur de chaque répertoire de type de contenu, les fichiers sont organisés par langue:

  - type: pre
    lang: text
    value: |
      contents/
      ├── posts/
      │   ├── en/
      │   │   ├── 0x00.template.yaml
      │   │   ├── 0x01.yaml
      │   │   └── 0x02.yaml
      │   └── fr/
      │       ├── 0x00.template.yaml
      │       ├── 0x01.yaml
      │       └── 0x02.yaml
      ├── codes/
      │   └── en/
      │       ├── 0x00.template.yaml
      │       ├── 0x01.yaml
      │       └── 0x02.yaml
      ├── notes/
      │   └── en/
      │       └── 0x01.yaml
      └── home/
          ├── home.en.yaml
          ├── home.fr.yaml
          └── home.de.yaml

  - type: text
    value: |
      Le sous-répertoire de langue détermine la langue du contenu.
      La page d'accueil est spéciale — elle vit en dehors du système de types
      et est configurée séparément.

  - type: section_title
    value: "Pagination"

  - type: text
    value: |
      Les types de contenu avec pagination_items_per_page défini divisent
      automatiquement leur index sur plusieurs pages. Le watcher du système de fichiers
      reconstruit les caches de pagination chaque fois qu'un fichier est ajouté, supprimé ou modifié.

  - type: terminal
    title: "routes générées automatiquement"
    prompt: "$"
    value: |
      /fr          → articles, page 1
      /fr/page/2   → articles, page 2
      /fr/codes    → index des codes
      /fr/notes    → index des notes

  - type: date
    value: "2026-05-07"

  - type: eol
---
