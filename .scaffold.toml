[template]
name = "dx5_template"
author = "Nino Marrazzo"

# File and folders to ignore during the scaffolding (will not be copied to the new project).
exclude = [
    ".opencode",
    ".scaffold.toml",
    ".git",
    ".gitignore",
    ".github",
    "target",
    "Cargo.lock"
]

disable_templating = [
    "README.md",
    "LEGEND.md",
    "templates/**/*.tera",
    "public/**/*",
    "static/**/*",
    "assets/**/*",
    "contents/**/*",
    "src/utils/error.html",
    "src/admin_ui.html",
    "config/locales/**/*.json",
    "config/dx5.fields.toml",
    "config/dx5.content_types.toml",
    "dx5.toml"
]

# Project's name (crate rust)
[parameters]
    [parameters.blog_name]
    message = "What's the new project's name? (used in Cargo.toml)"
    type = "string"
    default = "dx5-blog"
    regex = "^[a-z0-9_-]+$" # Force valid names for Rust

    [parameters.blog_base_url]
    message = "What's the project's base URL? (usually, in local dev, is http://localhost)"
    type = "string"
    default = "http://localhost"

    # Author
    [parameters.blog_author]
    message = "Who's the main author blog"
    type = "string"
    default = "Admin"

    # Blog title
    [parameters.blog_title]
    message = "Insert the blog's title"
    type = "string"
    default = "My new blog"

    # Main language
    [parameters.blog_lang]
    message = "What's the main blog's language (you can change it in dx5.toml)"
    type = "select"
    default = "en"
    values = ["it", "en", "fr", "es", "de"]

    # Enable SPA mode
    [parameters.spa_enabled]
    message = "Enable SPA mode? (true/false)"
    type = "boolean"
    default = true


    # Rocket port
    [parameters.rocket_port]
    message = "On which local port will server run? (rocket)"
    type = "string"
    default = "8000"

    # Repository GitHub (Useful for the footer's links)
    [parameters.github_username]
    message = "What's your GitHub name? (let it empty if you doesn't have one)"
    type = "string"
    default = ""

    # Admin panel enabled
    [parameters.admin_enabled]
    message = "Enable admin panel? (true/false)"
    type = "boolean"
    default = true

    # Admin token
    [parameters.admin_token]
    message = "Choose an admin authentication token (password)"
    type = "string"
    default = "change-this-token-value"

# Notes to display at the end of the generation (user welcome guide)
notes = """
🎉 Welcome to {{blog_name}} — your new dx5 blog is ready!

  ✔  Config:        config/dx5.toml  (edit title, lang, base_url...)
  ✔  Server:        cargo run  (starts at http://localhost:{{rocket_port}})
  {{#if admin_enabled}}
  ✔  Admin panel:   http://localhost:{{rocket_port}}/admin  (token: {{admin_token}})
  {{/if}}

── What you can do now ──────────────────────────────────────

  1. Add content
     Drop new .yaml files in contents/<type>/<lang>/
     (e.g., contents/posts/en/my-first-post.yaml)

  2. Create new content types
     Edit config/dx5.content_types.toml
     → define collections (e.g., "projects", "photos")

  3. Extend body fields
     Edit config/dx5.fields.toml
     → add your own custom field types with Tera templates

  4. Add translations
     Add/edit JSON files in config/locales/
     (e.g., config/locales/fr.json for French)

  5. Customize templates
     Edit .tera files under templates/
     → modify layout, components, type pages

  6. Headless JSON API
     http://localhost:{{rocket_port}}/api/<type>
     → consume your content from any frontend

  7. SPA mode
     {{#if spa_enabled}}SPA mode is ON — navigates without full reloads{{else}}SPA mode is OFF — toggle via spa_enabled in dx5.toml{{/if}}

  📖  Full docs: https://github.com/reinchek/dx5-dev-diary
      (or open README.md in your project root)

  Happy blogging! ✨
"""

[hooks]
# Commands to be executed after scaffolding, from within the generated project
post = [
    "cp config/dx5.toml.dist config/dx5.toml",
]