services:
  caddy:
    image: caddy:alpine
    container_name: dx5-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dx5
    restart: unless-stopped

  dx5:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: dx5-blog
    expose:
      - "8000"
    environment:
      - ROCKET_ADDRESS=0.0.0.0
      - ROCKET_PORT=8000
      - DX5_CONFIG=/app/config/dx5.toml
    volumes:
      # Mount content and config so edits take effect without rebuilding
      - ./contents:/app/contents
      - ./config:/app/config
      - ./templates:/app/templates
      - ./static:/app/static
      - ./assets:/app/assets
      - ./public:/app/public
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
